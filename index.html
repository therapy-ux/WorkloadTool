n:`On the Collection Sheet, why a claim was denied, left unpaid or paid short — in the team's own shorthand, for example "add a KX". The tool reads it to suggest the next step.`,see:["KX modifier","Collection Sheet"]},{term:"Blank claim",group:"money",definition:"A visit on the eligibility sheet with no Status — insurance has neither paid nor denied it. Normal for the first 30 days; due at 30–45; overdue after 45, when it belongs on the Collection Sheet.",see:["Timely filing","Collection Sheet"]},{term:"Denied claim",group:"money",definition:"Insurance refused to pay the visit. Somebody has to find out why (the EOB says), write it in Root Cause, and correct and resubmit or appeal.",see:["EOB","Root Cause"]},{term:"KX modifier",group:"money",definition:'A code added to a Medicare therapy claim once the patient passes the yearly therapy threshold, confirming the visits are still medically necessary. Without it Medicare denies or underpays — "add a KX" on the Collection Sheet means the claim has to be corrected and resubmitted with it.',see:["Denied claim"]},{term:"Timely filing",group:"money",definition:"The deadline each insurer sets for submitting or correcting a claim. Miss it and the visit cannot be paid at all, which is why a claim with no answer after 90 days is escalated.",see:["Blank claim"]},{term:"EOB",group:"money",definition:"Explanation of Benefits — the insurer's statement of what they paid and what the patient owes. Sent to a patient who disputes their balance.",see:["Copay"]},{term:"Eligibility sheet",group:"money",definition:'The "Claims Sheet 2026 & Copay Information" tab: one row per visit, every month, recording every payment for it — Client Payment from the patient, Insurance Payment and Total Amount from the insurer, the claim Status, and Reduction. The tool matches it to Home Care Patients by EMR ID to work out what each patient owes. Check it before chasing anybody: a balance may already have been paid.',see:["Copay","Deductible","Reduction"]}, eduled Visits",group:"sheet",definition:"Every appointment, past and future, with its therapist, status and confirmation. The tool reads the therapist's name from here — which is why capacity rows must spell it identically."},{term:"Medical Notes",group:"sheet",definition:"One row per note, with its date of service and units. Where the note-overdue and low-unit tasks come from."},{term:"Claims Sheet & Copay Information",group:"sheet",definition:"What was billed and what the patient owes per visit. Where copay balances come from."},{term:"Home Care Patients",group:"sheet",definition:'The patient master: phone numbers, emails, insurance. A patient missing from here raises an "Add patient" task, because none of their other tasks can be actioned without a number.'},{term:"Therapists Capacity & Areas",group:"sheet",definition:"One row per therapist per month: how many visits they can take, their days, and the ZIP codes they cover. Updated monthly."},{term:"Visits and Notes (Home Care)",group:"sheet",definition:"The workbook holding the Visits and Units tabs, refreshed first thing every morning. Everything else in the queue is worked out from it."},{term:"TaskLog",group:"sheet",definition:"A tab the tool creates. Every save is appended here, which is what makes the step history on Review work possible."},{term:"BreakLog",group:"sheet",definition:"A tab the tool creates, one row per break with its minutes, so breaks can be totalled in the spreadsheet."},{term:"Outcome",group:"tool",definition:'WHAT HAPPENED — the result you record when closing a task: "Visits booked", "Patient disputes". Choosing one reveals the recommended action.',see:["Status"]},{term:"Status",group:"tool",definition:'WHERE THE TASK SITS RIGHT NOW — not started, in progress, waiting for the therapist. Different from the outcome: a task can be "waiting for therapist" with no outcome yet.',see:["Outcome"]},{term:"Follow-up date",group:"tool",definition:"When to come back to this. Where a recommended action asks for one, the tool offers to set it — counted in business days, so a Friday chase lands on Monday."},{term:"Exception",group:"tool",definition:"Why the normal rule does not apply to this patient — a step-down in frequency, a planned discharge. Recorded so the same task is not re-argued next month."},{term:"Recommended action",group:"tool",definition:"What to do next, written by the coordinator who does the job. Appears once you pick an outcome, and carries a code so it can be traced back."},{term:"Name badge",group:"tool",definition:"Your name at the bottom of the sidebar. Not a login — it stamps completed work so two people can tell their entries apart, and opens follow-up emails from your own mailbox."},{term:"Low units",group:"tool",definition:"The task raised when a note carries fewer than 4 units. Worked as one list handed to billing rather than note by note.",see:["Units"]},{term:"Note overdue",group:"tool",definition:'The task raised when a completed visit has no finalised note past the 48-hour deadline. "Note due soon" is the same check inside the last 12 hours.',see:["Note","Finalised"]},{term:"Status update",group:"tool",definition:"The task raised when a past appointment has no outcome recorded — neither Checked-Out, Cancelled nor No Show. Usually chased with the therapist.",see:["Checked-Out"]},{term:"Systemic alert",group:"tool",definition:"When a problem hits most of the caseload at once the tool raises ONE alert instead of dozens of identical tasks — usually a data or export problem rather than a real collapse."},{term:"Waiting list",group:"tool",definition:"Patients who want home care and are eligible for it, but have no therapist to assign — either nobody is credentialed with their insurance, or nobody covers their area.",see:["Credentialed"]}],Xx=e=>e.filter(t=>!t.definition.trim());function Zx(e,t){const n=new Map(e.map(a=>[a.term.toLowerCase(),{...a}]));for(const a of t){if(!a?.term?.trim())continue;const i=a.term.trim().toLowerCase(),r=n.g
