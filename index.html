",group:"work",definition:"The therapist's clinical record of a visit. Due within 48 hours; the visit cannot be billed until it is finalised.",see:["Finalised","Note overdue"]},{term:"Finalised",group:"work",definition:"A note the therapist has signed off. A note that is written but not finalised still counts as outstanding — a common cause of a task that looks wrong."},{term:"Checked-Out",group:"work",definition:"The appointment status meaning the visit happened. Along with Cancelled and No Show it settles an appointment; anything else counts as an outcome nobody recorded.",see:["Status update"]},{term:"No Show",group:"work",definition:"The patient did not attend and did not cancel. Settles the appointment, unlike a blank status."},{term:"Active patient",group:"work",definition:"For any period — a week, a month, or dates you pick — a patient with at least one completed visit inside it. The same patient can be active one week and not the next.",see:["PCR","Incident"]},{term:"Incident",group:"work",definition:"A full week (7 days) with no completed visit after a visit — whether the patient then came back or has not. Every incident needs a reason (physician discontinued, therapist no longer available, no response from patient…), recorded on its Incident task; the reason says whether the patient was lost, needs a new therapist, or needs following up. It counts in the period its gap started in.",see:["PCR","Active patient"]},{term:"PCR",group:"work",definition:"Home Recovery's measure of patient drop-off: active patients with an incident ÷ active patients, for a week, a month or any dates. A period is only final once a full week has passed after it ends — before that, a patient seen on its last day could still turn out to have a gap.",see:["Incident","Active patient","Plan of care"]},{term:"Plan of care",group:"work",definition:"How often a patient is meant to be seen — at least 2 visits a week in Home Recovery. Frequency (visits per week on service) is measured against it; it is separate from PCR, which measures drop-off.",see:["PCR"]},{term:"PTA",group:"work",definition:"Physical therapist assistant. Treats the patient under a PT's supervision; cannot do evaluations, re-evaluations, progress notes or discharge. On Units Breakdown a visit is a PTA's when the Documenting and Finalizing Therapist differ.",see:["Supervising PT","PT of record","CQ modifier"]},{term:"Supervising PT",group:"work",definition:"The PT who co-signs (finalizes) a PTA's notes. In New York home care a PT may supervise no more than 2 PTAs, and must treat the patient at least every 6 visits or 30 days, whichever comes first.",see:["PTA","PT of record"]},{term:"PT of record",group:"work",definition:"The PT who did the patient's latest evaluation or re-evaluation — the one responsible for their plan of care, even while a PTA does the follow-ups.",see:["PTA","Supervising PT"]},{term:"CQ modifier",group:"money",definition:"Added to a claim line when a PTA furnished the service in whole or in part. Medicare Part B pays those lines at 85%; Aetna (since March 2024) and UnitedHealthcare Medicare plans do the same. Missing it bills a PTA visit as if a PT did it.",see:["PTA","KX modifier"]},{term:"Copay",group:"money",definition:"The fixed share of a visit the patient pays. In this office they either pay the therapist in cash at each visit, or ask to be invoiced.",see:["Deductible","Eligibility sheet"]},{term:"Deductible",group:"money",definition:'What the patient pays before their insurance starts covering visits. Home Care Patients says who has one and what the office collects each session ("$15 a session until the deductible is met"). On the eligibility sheet those visits show Status "Deduct", with what insurance applied in Reduction. Once insurance starts paying in full, the deductible is met — change Payment on Home Care Patients.',see:["Eligibility sheet","Reduction"]},{term:"Self pay",group:"money",definition:"No insurance involved — the patient pays for the visit themselves."},{term:"No Payment",group:"money",definition:"On Home Care Patients this means insurance covers the patient in full and they owe nothing. It is a settled patient, NOT missing data — the tool never chases it. If the eligibility sheet shows a Deduct or a Reduction for them anyway, the Copay screen lists it under Needs checking."},{term:"Reduction",group:"money",definition:'On the eligibility sheet, the deductible amount — what insurance put on the patient instead of paying it, usually on a row with Status "Deduct". The tool prices a visit with it only when Home Care Patients has no Amount.',see:["Deductible","Eligibility sheet"]},{term:"Coinsurance",group:"money",definition:"The share of a visit left for the patient (or their secondary insurance) after the insurer pays its part — Medicare pays 80% and leaves 20%. On the eligibility sheet, Co-Insurance Payment is coinsurance received. When a copay patient's copay is collected (Client Payment) and the claim is still under $85, the rest is coinsurance.",see:["Copay","Deductible","Eligibility sheet"]},{term:"Collection Sheet",group:"money",definition:"The tab the collection team works from: the claims they filter out of the eligibility sheet, with the Elig Status when they pulled it, their own Status (Action Taken, Paid), the Root Cause and the Action taken. The Claims & collections screen matches it back to the eligibility sheet by EMR ID and DOS.",see:["Eligibility sheet","Root Cause"]},{term:"Root Cause",group:"money",definition:`On the Collection Sheet, why a claim was denied, left unpaid or paid short — in the team's own shorthand, for example "add a KX". The tool reads it to suggest the next step.`,see:["KX modifier","Collection Sheet"]},{term:"Blank claim",group:"money",definition:"A visit on the eligibility sheet with no Status — insurance has neither paid nor denied it. Normal for the first 30 days; due at 30–45; overdue after 45, when it belongs on the Collection Sheet.",see:["Timely filing","Collection Sheet"]},{term:"Denied claim",group:"money",definition:"Insurance refused to pay the visit. Somebody has to find out why (the EOB says), write it in Root Cause, and correct and resubmit or appeal.",see:["EOB","Root Cause"]},{term:"KX modifier",group:"money",definition:'A code added to a Medicare therapy claim once the patient passes the yearly therapy threshold, confirming the visits are still medically necessary. Without it Medicare denies or underpays — "add a KX" on the Collection Sheet means the claim has to be corrected and resubmitted with it.',see:["Denied claim"]},{term:"Timely filing",group:"money",definition:"The deadline each insurer sets for submitting or correcting a claim. Miss it and the visit cannot be paid at all, which is why a claim with no answer after 90 days is escalated.",see:["Blank claim"]},{term:"EOB",group:"money",definition:"Explanation of Benefits — the insurer's statement of what they paid and what the patient owes. Sent to a patient who disputes their balance.",see:["Copay"]},{term:"Eligibility sheet",group:"money",definition:'The "Claims Sheet 2026 & Copay Information" tab: one row per visit, every month, recording every payment for it — Client Payment from the patient, Insurance Payment and Total Amount from the insurer, the claim Status, and Reduction. The tool matches it to Home Care Patients by EMR ID to work out what each patient owes. Check it before chasing anybody: a balance may already have been paid.',see:["Copay","Deductible","Reduction"]},{term:"Collection agency",group:"money",definition:"The outside agency used to collect copays and deductibles from patients who refuse to pay, or who cannot be reached.",see:["Copay","Deductible"]},{term:"RCM",group:"money",definition:"Revenue cycle management — billing, claims and collections end to end. Handled by the billing department.",see:["Billing department"]},{term:"WebPT",group:"people",definition:"The system holding patient charts, appointments and notes. The spreadsheet is fed from it, so a correction usually has to be made in WebPT rather than in the sheet."},{term:"Medical auditing",group:"people",definition:"The department that finalises medical notes and reviews them for anything missing or needing to be added. A note under 4 units should never have been finalised — the therapist is paid to deliver a one-hour session — so a low-unit note goes back to them rather than to the therapist first.",see:["Units","Low units","Finalised"]},{term:"Authorisation department",group:"people",definition:"The department handling pre-authorisation for patients, putting patients on hold, and anything else authorisation-related.",see:["Authorisation"]},{term:"Billing department",group:"people",definition:"The department that runs the revenue cycle for Home Recovery.",see:["RCM"]},{term:"Credentialed",group:"people",definition:"A therapist approved by an insurer to treat patients covered by it. A patient can only be assigned to a therapist credentialed with THEIR insurance — one of the two reasons somebody ends up on the waiting list.",see:["Waiting list"]},{term:"Finance agent",group:"people",definition:"Who raises the patient invoices. You send them the patient's details, the session dates and the amounts; they invoice and tell you when it is paid.",see:["Copay"]},{term:"Payroll",group:"people",definition:"Cash a therapist collected from a patient comes off their next payroll, which is why every cash visit has to be confirmed with them before payroll runs."},{term:"Scheduled Visits",group:"sheet",definition:"Every appointment, past and future, with its therapist, status and confirmation. The tool reads the therapist's name from here — which is why capacity rows must spell it identically."},{term:"Medical Notes",group:"sheet",definition:"One row per note, with its date of service and units. Where the note-overdue and low-unit tasks come from."},{term:"Claims Sheet & Copay Information",group:"sheet",definition:"What was billed and what the patient owes per visit. Where copay balances come from."},{term:"Home Care Patients",group:"sheet",definition:'The patient master: phone numbers, emails, insurance. A patient missing from here raises an "Add patient" task, because none of their other tasks can be actioned without a number.'},{term:"Therapists Capacity & Areas",group:"sheet",definition:"One row per therapist per month: how many visits they can take, their days, and the ZIP codes they cover. Updated monthly."},{term:"Visits and Notes (Home Care)",group:"sheet",definition:"The workbook holding the Visits and Units tabs, refreshed first thing every morning. Everything else in the queue is worked out from it."},{term:"TaskLog",group:"sheet",definition:"A tab the tool creates. Every save is appended here, which is what makes the step history on Review work possible."},{term:"BreakLog",group:"sheet",definition:"A tab the tool creates, one row per break with its minutes, so breaks can be totalled in the spreadsheet."},{term:"Outcome",group:"tool",definition:'WHAT HAPPENED — the result you record when closing a task: "Visits booked", "Patient disputes". Choosing one reveals the recommended action.',see:["Status"]},{term:"Status",group:"tool",definition:'WHERE THE TASK SITS RIGHT NOW — not started, in progress, waiting for the therapist. Different from the outcome: a task can be "waiting for therapist" with no outcome yet.',see:["Outcome"]},{term:"Follow-up date",group:"tool",definition:"When to come back to this. Where a recommended action asks for one, the tool offers to set it — counted in business days, so a Friday chase lands on Monday."},{term:"Exception",group:"tool",definition:"Why the normal rule does not apply to this patient — a step-down in frequency, a planned discharge. Recorded so the same task is not re-argued next month."},{term:"Recommended action",group:"tool",definition:"What to do next, written by the coordinator who does the job. Appears once you pick an outcome, and carries a code so it can be traced back."},{term:"Name badge",group:"tool",definition:"Your name at the bottom of the sidebar. Not a login — it stamps completed work so two people can tell their entries apart, and opens follow-up emails from your own mailbox."},{term:"Low units",group:"tool",definition:"The task raised when a note carries fewer than 4 units. Worked as one list handed to billing rather than note by note.",see:["Units"]},{term:"Note overdue",group:"tool",definition:'The task raised when a completed visit has no finalised note past the 48-hour deadline. "Note due soon" is the same check inside the last 12 hours.',see:["Note","Finalised"]},{term:"Status update",group:"tool",definition:"The task raised when a past appointment has no outcome recorded — neither Checked-Out, Cancelled nor No Show. Usually chased with the therapist.",see:["Checked-Out"]},{term:"Systemic alert",group:"tool",definition:"When a problem hits most of the caseload at once the tool raises ONE alert instead of dozens of identical tasks — usually a data or export problem rather than a real collapse."},{term:"Pod",group:"tool",definition:"One PT and up to two PTAs, covering one area. Cases are assigned to the pod rather than to a person, so cover is visible as cover. Set with the Pod column on Therapists Capacity & Areas.",see:["PTA"]},{term:"Move to PTA",group:"tool",definition:"The list of every active case a PT is still doing all the follow-ups on, with the stage each one has reached. A case counts as moved when a PTA has actually documented a follow-up visit — not when a box is ticked.",see:["Pod","Follow-up visit"]},{term:"Follow-up visit",group:"work",definition:"A daily-note visit — the treatment visits between the assessments. These are the ones a PTA may take; the evaluation, re-evaluation, progress note and discharge stay with the PT."},{term:"PT only",group:"work",definition:"A case a PTA may not take — too complex, the payer will not have it, or the patient asked for the PT. Recorded in the Care model column on Home Care Patients, or by parking the case on the Caseload screen."},{term:"Needs reassigning",group:"tool",definition:"The task raised when the therapist seeing a patient has kept them under 2 visits a week for two of the last three weeks, with nothing booked to fix this week and no reason recorded. A patient nobody has seen for over three weeks is an incident instead.",see:["Incident","Therapist page"]},{term:"Feedback score",group:"work",definition:"The score out of 5 and the comment recorded on a visit in Scheduled Visits. A low one usually arrives before a patient goes quiet, so it shows on their incidents, on any reassignment and on the therapist’s own page.",see:["Incident","Needs reassigning"]},{term:"Scorecard",group:"tool",definition:"The coordinator’s own measures: how fast work was picked up, whether blocked items were chased, whether reasons were written down, and closure on the tasks she owns. Volume, notes, denials and supervision are shown separately as the state of the clinic, because they are not hers to control.",see:["Who acts"]},{term:"Who acts",group:"tool",definition:"Who has to do something about a task — the coordinator, the collection team, the billing department, the manager, the supervising PT or the therapist. Set by the rule that raised it, and what the scorecard counts closure on."},{term:"Pace",group:"tool",definition:"Month-to-date against the target for the days that have passed, rather than against the whole month. It is how the Monthly Target screen can say on the 15th that a month is going wrong.",see:["Monthly target"]},{term:"Monthly target",group:"work",definition:"The visits and new patients the office set out to do each day, on the Monthly Target tab. The new-patient half is met from the waiting list, so the two are read together.",see:["Waiting list"]},{term:"SLA",group:"money",definition:"How many days a payer usually takes to pay, from the Insurance payment tab. A claim is only late when it is late for its own payer — 150 days for VillageCareMAX is normal, 46 for Medicare is not."},{term:"Match ID",group:"money",definition:'An insurance name with everything but letters and digits removed, so "AETNA COMMERCIAL – (ZAYA)" and "Aetna Commercial (Zaya)" land on the same rate.'},{term:"Switched off",group:"tool",definition:"A check the tool cannot run properly because a column is missing — listed on Data health with the one edit that turns it back on. Nothing is broken; the sheet has not been asked for that yet."},{term:"Who has room",group:"tool",definition:"One answer to who can take a patient, used by the waiting list, by reassignment and by the pods: spare visits a week, the ZIPs they cover, the insurers they are credentialed with — minus what has already been promised to somebody else.",see:["Waiting list","Needs reassigning"]},{term:"Therapist page",group:"tool",definition:"The mirror of the patient page: one therapist, with their caseload, pod, supervision, gaps, reassignments and open tasks gathered from every tab. Click any therapist name anywhere in the tool.",see:["Pod"]},{term:"Waiting list",group:"tool",definition:"Patients who want home care and are eligible for it, but have no therapist to assign — either nobody is credentialed with their insurance, or nobody covers their area.",see:["Credentialed"]}],jk=e=>e.filter(t=>!t.definition.trim());function Nk(e,t){const s=new Map(e.map(a=>[a.term.toLowerCase(),{...a}]));for(const a of t){if(!a?.term?.trim())continue;const i=a.term.trim().toLowerCase(),o=s.get(i);s.set(i,o?{...o,definition:a.definition??o.definition}:{term:a.term.trim(),definition:a.definition??"",group:a.group??"tool",see:a.see})}return[...s.values()].sort((a,i)=>a.term.localeCompare(i.term))}function kk({saved:e,onSave:t,identity:s,shared:a}){const[i,o]=D.useState(""),[r,l]=D.useState(null),[c,u]=D.useState(null),[g,d]=D.useState(""),h=D.useMemo(()=>Nk(wk,e),[e]),y=D.useMemo(()=>jk(h),[h]),m=h.filter(x=>{if(r&&x.group!==r)return!1;if(!i.trim())return!
